name: Desktop (manual)

# Ad-hoc desktop installer build for testing, uploaded as workflow artifacts.
# Tagged releases build + attach installers via release.yml instead.
on:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS DMG (Intel + Apple Silicon) on an Apple Silicon
          # runner — avoids the scarce/deprecated macos-13 Intel runner.
          - platform: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux WebKit dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web + desktop deps
        run: |
          npm ci --prefix web
          npm ci --prefix apps/desktop

      # macOS universal needs all three sidecars: a per-arch binary for each
      # arch's app compile, plus a lipo'd universal binary for the final bundle.
      - name: Build & stage sidecars (macOS universal)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p garudust-server --target aarch64-apple-darwin
          cargo build --release -p garudust-server --target x86_64-apple-darwin
          mkdir -p apps/desktop/src-tauri/binaries
          cd apps/desktop/src-tauri/binaries
          BASE=../../../../target
          cp "$BASE/aarch64-apple-darwin/release/garudust-server" garudust-server-aarch64-apple-darwin
          cp "$BASE/x86_64-apple-darwin/release/garudust-server"  garudust-server-x86_64-apple-darwin
          lipo -create \
            garudust-server-aarch64-apple-darwin \
            garudust-server-x86_64-apple-darwin \
            -output garudust-server-universal-apple-darwin

      - name: Build & stage sidecar (single arch)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --release -p garudust-server --target ${{ matrix.target }}
          mkdir -p apps/desktop/src-tauri/binaries
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          cp "target/${{ matrix.target }}/release/garudust-server${EXT}" \
             "apps/desktop/src-tauri/binaries/garudust-server-${{ matrix.target }}${EXT}"

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: garudust-desktop-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
          if-no-files-found: ignore
