# Standalone workspace — excluded from the root so WASM/Leptos deps don't
# affect `cargo build/test --workspace` on the server crates.
[workspace]

[package]
name    = "garudust-web"
version = "0.13.8"
edition = "2021"

[[bin]]
name = "garudust-web"
path = "src/main.rs"

[dependencies]
# UI framework — CSR (client-side rendering) mode for WASM in a webview.
leptos = { version = "0.7", features = ["csr"] }

# HTTP + WebSocket (higher-level than raw web_sys).
gloo-net = { version = "0.6", features = ["websocket", "http", "json"] }

# Timers / intervals (for health polling).
gloo-timers = { version = "0.3", features = ["futures"] }

# WASM glue
futures               = { version = "0.3", default-features = false, features = ["alloc"] }
wasm-bindgen          = "0.2"
wasm-bindgen-futures  = "0.4"
js-sys                = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
] }

# Data
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
uuid         = { version = "1", features = ["v4", "js"] }

# Markdown → HTML (for chat bubbles)
pulldown-cmark = { version = "0.11", default-features = false, features = ["html"] }

# Better panic messages in the browser console
console_error_panic_hook = "0.1"
