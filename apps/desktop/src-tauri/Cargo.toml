# Standalone workspace — kept out of the repo-root cargo workspace so Tauri's
# GUI dependency tree does not slow down core builds/tests.
[workspace]

[package]
name = "garudust-desktop"
version = "0.13.2"
description = "Garudust desktop shell"
authors = ["Garudust"]
license = "MIT"
edition = "2021"
rust-version = "1.87"

[[bin]]
name = "garudust-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
