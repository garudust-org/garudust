# Native desktop app — pure-Rust egui GUI with the agent embedded in-process
# (no webview, WASM, JS, or sidecar). Own workspace so its GUI deps stay out of
# the core build.
[workspace]

[package]
name = "garudust-desktop-native"
version = "0.13.6"
description = "Garudust native desktop app (egui)"
authors = ["Garudust"]
license = "MIT"
edition = "2021"
rust-version = "1.87"

[[bin]]
name = "garudust-desktop-native"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
egui_commonmark = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }

# Embed the agent directly (in-process; no sidecar, no HTTP).
garudust-core      = { path = "../../crates/garudust-core" }
garudust-agent     = { path = "../../crates/garudust-agent" }
garudust-transport = { path = "../../crates/garudust-transport" }
garudust-tools     = { path = "../../crates/garudust-tools" }
garudust-memory    = { path = "../../crates/garudust-memory" }

[profile.release]
strip = true
opt-level = 3
lto = "thin"

# cargo-packager — builds .dmg / .exe / .AppImage / .deb from this binary.
# Install:  cargo install cargo-packager --locked
# Package:  cargo packager --release   (run in this directory)
[package.metadata.packager]
product-name = "Garudust"
identifier = "ai.garudust.desktop"
icons = ["icons/icon.icns", "icons/icon.ico", "icons/128x128.png", "icons/32x32.png"]
out-dir = "dist"
